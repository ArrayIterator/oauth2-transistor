# Transistor — OAuth2 forwarder (Cloudflare Worker)
# Spec: docs/spec.md (spec v1, state format v5)
#
# Deploy: npx wrangler deploy
# (or paste src/index.js in the Cloudflare dashboard and attach the
#  custom domain transistor.pentagonal.org manually)

name = "transistor"
main = "src/index.js"
compatibility_date = "2026-11-24"

# Static files served from public/ (legal pages, error page, logo,
# robots.txt). The Worker handles /oauth2 itself and delegates every
# other path to these assets; unknown paths get the error page (404).
# run_worker_first = true is REQUIRED: without it Cloudflare serves a
# matching static asset before the Worker runs, so the Worker's
# redirects and 404 page never execute (the asset store also
# canonicalises .html URLs to clean URLs, the opposite of what we
# want). With it, every request goes through the Worker first and the
# code below decides what to serve.
# binding = "ASSETS" is REQUIRED too: without it env.ASSETS is
# undefined in the Worker, so every asset fetch fails and every page
# falls back to the inline minimal error page (that is why the live
# site showed "Something went wrong" for every path after the
# run_worker_first deploy).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# Custom domain — the trust anchor users see. Reachable via the DNS
# CNAME transistor.pentagonal.org → transistor.nwm-643.workers.dev
# (same pattern as muse-licensing: NO [[routes]] here — a route plus
# the CNAME made Cloudflare 522). The Worker is also reachable on
# its workers.dev URL for testing.
