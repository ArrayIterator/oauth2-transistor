# Transistor - OAuth2 forwarder (Cloudflare Worker)
# Spec: docs/spec.md (spec v1, state format v5)
#
# Deploy: npx wrangler deploy
# (or paste src/index.js in the Cloudflare dashboard and attach the
#  custom domain transistor.pentagonal.org manually)

name = "transistor"
main = "src/index.js"
compatibility_date = "2026-11-24"

# Custom domain - the trust anchor users see. Reachable via the DNS
# CNAME transistor.pentagonal.org -> transistor.nwm-643.workers.dev
# (same pattern as muse-licensing). This is a `custom_domain` route,
# NOT a wildcard [[routes]] pattern: the old
# `pattern = "transistor.pentagonal.org/*"` route plus the CNAME made
# Cloudflare 522. The custom_domain route is the modern way to attach
# a domain to a Worker with Static Assets, and it is REQUIRED - with
# only the DNS CNAME and no route, the asset store serves `/` directly
# but Worker-invoked paths (/oauth2, /terms, /nope) 522 because the
# Worker is not bound to the custom domain for them.
#
# NOTE: `routes` is a TOP-LEVEL key - it MUST sit here, before the
# [assets] table. A `routes` line placed after [assets] is silently
# parsed as assets.routes and ignored (wrangler warns "Unexpected
# fields found in assets field: routes"). That is exactly what
# happened before: the route never applied, so the custom domain was
# never bound to the Worker.
routes = [
  { pattern = "transistor.pentagonal.org", custom_domain = true },
]

# Static files served from public/ (legal pages, error page, logo,
# robots.txt). The Worker handles /oauth2 itself and delegates every
# other path to these assets; unknown paths get the error page (404).
# run_worker_first = true is REQUIRED: without it Cloudflare serves a
# matching static asset before the Worker runs, so the Worker's
# redirects and 404 page never execute (the asset store also
# canonicalises .html URLs to clean URLs, the opposite of what we
# want). With it, every request goes through the Worker first and the
# code below decides what to serve.
# binding = "ASSETS" is REQUIRED too: without it env.ASSETS is
# undefined in the Worker, so every asset fetch fails and every page
# falls back to the inline minimal error page (that is why the live
# site showed "Something went wrong" for every path after the
# run_worker_first deploy).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# Analytics (Google Tag Manager). Set GTM_ID to a GTM container ID
# (GTM-...) and the Worker injects the GTM snippet into <head>
# (plus the <noscript> fallback after <body>) of every HTML page
# it serves (home, about, privacy, terms, error). Empty/missing =
# no snippet, pages served as-is. The ID is public (it ships in the
# page source), so it is a plain var here, not a secret. Change it
# and redeploy (push to GitHub).
[vars]
GTM_ID = "GTM-5WJNQRMN"
