<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Transistor icon">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="pent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Outer pentagon outline -->
  <polygon points="400,80 685,287 576,623 224,623 115,287"
    fill="none" stroke="url(#pent)" stroke-width="7" stroke-linejoin="round"/>
  <!-- Rings on the pentagon vertices -->
  <g fill="none" stroke="#22D3EE" stroke-width="4">
    <circle cx="400" cy="80" r="8"/>
    <circle cx="685" cy="287" r="8"/>
    <circle cx="576" cy="623" r="8"/>
    <circle cx="224" cy="623" r="8"/>
    <circle cx="115" cy="287" r="8"/>
  </g>

  <!-- Roof chevron above the chip -->
  <polyline points="310,255 400,190 490,255" fill="none"
    stroke="url(#chip)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chip -->
  <rect x="300" y="280" width="200" height="170" rx="18" fill="url(#chip)"/>
  <!-- Chip traces -->
  <g stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="315" y1="320" x2="485" y2="320"/>
    <line x1="315" y1="350" x2="470" y2="350"/>
    <line x1="315" y1="380" x2="440" y2="380"/>
    <line x1="440" y1="380" x2="470" y2="410"/>
    <line x1="315" y1="410" x2="485" y2="410"/>
  </g>
  <g fill="none" stroke="#1E293B" stroke-width="4">
    <circle cx="400" cy="320" r="7"/>
    <circle cx="360" cy="350" r="7"/>
    <circle cx="420" cy="410" r="7"/>
  </g>

  <!-- Pins -->
  <g fill="url(#chip)">
    <path d="M322,450 h36 l-6,45 h-24 z"/>
    <path d="M382,450 h36 l-6,45 h-24 z"/>
    <path d="M442,450 h36 l-6,45 h-24 z"/>
  </g>
  <g stroke-linecap="round">
    <line x1="340" y1="495" x2="340" y2="575" stroke="#38BDF8" stroke-width="6"/>
    <line x1="400" y1="495" x2="400" y2="575" stroke="#38BDF8" stroke-width="6"/>
    <line x1="460" y1="495" x2="460" y2="575" stroke="#38BDF8" stroke-width="6"/>
  </g>

  <!-- Outer circuit traces -->
  <g stroke="#22D3EE" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="150" y1="200" x2="112" y2="148"/>
    <line x1="168" y1="300" x2="118" y2="300"/>
    <line x1="198" y1="452" x2="148" y2="482"/>
    <line x1="650" y1="200" x2="688" y2="148"/>
    <line x1="632" y1="300" x2="682" y2="300"/>
    <line x1="602" y1="452" x2="652" y2="482"/>
    <line x1="350" y1="700" x2="350" y2="742"/>
    <line x1="450" y1="700" x2="450" y2="742"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="112" cy="148" r="6"/>
    <circle cx="118" cy="300" r="6"/>
    <circle cx="148" cy="482" r="6"/>
    <circle cx="688" cy="148" r="6"/>
    <circle cx="682" cy="300" r="6"/>
    <circle cx="652" cy="482" r="6"/>
    <circle cx="350" cy="742" r="6"/>
    <circle cx="450" cy="742" r="6"/>
  </g>
</svg>
