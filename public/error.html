<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ERROR_TITLE}} — Transistor</title>
<meta name="description" content="Transistor — OAuth2 forwarding service.">
<meta name="robots" content="noindex, noarchive, noodp, noydir">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/logo/transistor-icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo/transistor-icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/logo/transistor-icon-180.png">
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: #fff; color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { display: flex; flex-direction: column; align-items: center; padding: 32px 20px; text-align: center; max-width: 560px; }
.logo { width: 72px; height: auto; display: block; animation: rise .5s ease both, float 5s ease-in-out 1s infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.code {
  margin: 20px 0 0; font-size: clamp(96px, 28vw, 144px); font-weight: 800;
  line-height: 1; letter-spacing: -0.04em;
  background: linear-gradient(90deg, #4DD0C8, #47A4C5);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rise .6s ease .1s both;
}
h1 { margin: 12px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; animation: rise .6s ease .2s both; }
p.msg { margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: #5f6368; animation: rise .6s ease .3s both; }
.btn {
  margin-top: 28px; display: inline-block; padding: 12px 28px; border-radius: 999px;
  background: linear-gradient(90deg, #4DD0C8, #47A4C5); color: #fff;
  font-size: 15px; font-weight: 600; text-decoration: none;
  box-shadow: 0 6px 20px rgba(71,164,197,.35);
  transition: transform .15s ease, box-shadow .15s ease;
  animation: rise .6s ease .4s both;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(71,164,197,.45); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
footer { margin-top: 56px; font-size: 14px; color: #5f6368; animation: rise .6s ease .5s both; }
footer a { color: #5f6368; text-decoration: none; margin: 0 10px; }
footer a:hover { text-decoration: underline; color: #1a73e8; }
@media (prefers-reduced-motion: reduce) {
  .logo, .code, h1, p.msg, .btn, footer { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/images/logo/transistor-icon.svg" width="72" height="72" alt="Transistor">
  <div class="code">{{ERROR_CODE}}</div>
  <h1>{{ERROR_TITLE}}</h1>
  <p class="msg">{{ERROR_MESSAGE}}</p>
  <a class="btn" href="/">Back to Transistor</a>
</main>
<footer>
  <a href="/about">About</a>
  <a href="/privacy">Privacy Policy</a>
  <a href="/terms">Terms of Service</a>
</footer>
</body>
</html>
